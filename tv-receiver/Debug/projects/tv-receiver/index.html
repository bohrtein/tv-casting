<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, user-scalable=no">
<title>TV Casting Receiver</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="idle-screen" class="screen">
    <div class="idle-panel">
      <div class="brand">tv-casting</div>
      <div id="qr-holder" class="qr-holder"></div>
      <div class="code-row">
        <span class="code-label">Code</span>
        <span id="room-code" class="room-code">------</span>
      </div>
      <div id="connection-note" class="connection-note">Connecting to relay&hellip;</div>
    </div>
  </div>

  <div id="player-screen" class="screen hidden">
    <object id="av-player" type="application/avplayer"></object>
    <div class="now-playing">
      <div id="now-playing-title" class="now-playing-title"></div>
      <div id="now-playing-state" class="now-playing-state"></div>
    </div>
  </div>

  <div id="error-banner" class="error-banner hidden"></div>

  <!-- Samsung device API bridge: provides window.webapis (AVPlay, etc).
       Only resolves on a real Tizen TV / the Tizen Studio TV emulator. -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/config.js"></script>
  <script src="js/relay-client.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
