<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, user-scalable=no">
<title>TV Casting Receiver</title>
<!-- Matrix's tokens, flattened to literal values for this TV's old
     browser (tools/sync.py --tokens-only --device tv from matrix_design);
     css/style.css builds the 10-foot UI from them. -->
<link rel="stylesheet" href="matrix/matrix-tokens.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="idle-screen" class="screen">
    <!-- Static still, on purpose: a looping <video> background never
         played on the real TV (see README.md). Don't reintroduce one. -->
    <div class="idle-bg" aria-hidden="true"></div>
    <div class="idle-vignette" aria-hidden="true"></div>
    <div class="idle-scanlines" aria-hidden="true"></div>
    <div class="idle-panel">
      <div class="brand">tv-casting</div>
      <div id="connection-note" class="connection-note">Connecting to relay&hellip;</div>
    </div>
  </div>

  <div id="player-screen" class="screen hidden">
    <object id="av-player" type="application/avplayer"></object>
    <div id="player-controls" class="now-playing hidden">
      <div id="now-playing-title" class="now-playing-title"></div>
      <div id="now-playing-state" class="now-playing-state"></div>
      <div class="transport-controls" role="group" aria-label="Playback controls">
        <button id="rewind" type="button" aria-label="Back 10 seconds">&#9664; 10s</button>
        <button id="play-pause" class="primary-control" type="button">Pause</button>
        <button id="forward" type="button" aria-label="Forward 10 seconds">10s &#9654;</button>
      </div>
      <div class="remote-hint">&#8592; Back 10s &nbsp; OK Play / pause &nbsp; Forward 10s &#8594;</div>
    </div>
  </div>

  <div id="error-banner" class="error-banner hidden"></div>

  <!-- Samsung device API bridge: provides window.webapis (AVPlay, etc).
       Only resolves on a real Tizen TV / the Tizen Studio TV emulator. -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="js/log.js"></script>
  <script src="js/config.js"></script>
  <script src="js/relay-client.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
