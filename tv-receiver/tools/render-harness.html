<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background: #000;
    overflow: hidden;
  }
  #mx-rain {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
  }
  /* Matrix 1.1: one canvas, no bloom, at --mx-rain-opacity. */
  #mx-rain { opacity: 0.45; }
</style>
</head>
<body>
<canvas id="mx-rain"></canvas>
<!-- Reuses the real design system's animation unmodified, at full quality --
     this only ever runs here at record time, never on the TV itself. -->
<script src="../../companion/matrix/matrix.js"></script>
</body>
</html>
