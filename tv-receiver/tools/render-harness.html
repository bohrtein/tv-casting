<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background: #000400;
    overflow: hidden;
  }
  #mx-rain, #mx-rain-bloom {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
  }
  #mx-rain { opacity: 0.9; }
  #mx-rain-bloom { filter: blur(9px) saturate(1.4) brightness(1.6); }
</style>
</head>
<body>
<canvas id="mx-rain-bloom"></canvas>
<canvas id="mx-rain"></canvas>
<!-- Reuses the real design system's animation unmodified, at full quality --
     this only ever runs here at record time, never on the TV itself. -->
<script src="../../companion/matrix.js"></script>
</body>
</html>
